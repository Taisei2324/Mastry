<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Merch — Mastry</title>
  <link rel="icon" href="images/better web logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{-webkit-text-size-adjust:100%;overflow-x:hidden;scroll-behavior:smooth;}
    body{font-family:'Inter',sans-serif;background:#0d0d0d;color:#f5f0e8;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
    :root{--sage:#4a6040;--cream:#f5f0e8;--muted:rgba(245,240,232,0.55);--border:rgba(245,240,232,0.12);--nav-h:56px;--tab-h:calc(54px + env(safe-area-inset-bottom));}

    /* NAV */
    .m-nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);display:flex;align-items:center;justify-content:space-between;padding:0 16px;padding-top:env(safe-area-inset-top);background:rgba(13,13,13,0.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);z-index:100;}
    .m-nav__back{background:none;border:none;color:var(--cream);padding:8px;cursor:pointer;touch-action:manipulation;font-size:1.2rem;display:flex;align-items:center;justify-content:center;text-decoration:none;}
    .m-nav__title{flex:1;text-align:center;font-size:0.95rem;font-weight:900;letter-spacing:0.22em;color:var(--cream);}
    section{scroll-margin-top:var(--nav-h);}

    /* HEADER */
    .m-header{padding:40px 20px 30px;margin-top:var(--nav-h);background:linear-gradient(135deg,rgba(74,96,64,0.1) 0%,rgba(74,96,64,0.05) 100%);border-bottom:1px solid var(--border);}
    .m-header__eyebrow{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--sage);margin-bottom:12px;display:block;}
    .m-header__title{font-size:2.2rem;font-weight:900;line-height:1.1;letter-spacing:-0.03em;color:var(--cream);}

    /* MERCH GRID */
    .m-merch{padding:28px 20px calc(28px + var(--tab-h));background:#0d0d0d;}
    .m-merch-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
    .m-merch-item{background:#1a1a1a;border:1px solid var(--border);overflow:hidden;cursor:pointer;touch-action:manipulation;transition:opacity .2s;}
    .m-merch-item:active{opacity:0.75;}
    .m-merch-item__img{width:100%;aspect-ratio:1;background:#111;display:flex;align-items:center;justify-content:center;font-size:3rem;}
    .m-merch-item__info{padding:14px;}
    .m-merch-item__name{font-size:0.85rem;font-weight:700;color:var(--cream);margin-bottom:6px;display:block;letter-spacing:0.01em;}
    .m-merch-item__price{font-size:0.75rem;color:var(--sage);font-weight:600;margin-bottom:8px;display:block;}
    .m-merch-item__btn{width:100%;padding:10px;background:transparent;border:1px solid var(--border);color:var(--cream);font-family:inherit;font-size:0.65rem;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;touch-action:manipulation;transition:opacity .2s;}
    .m-merch-item__btn:active{opacity:0.7;}

    /* FOOTER */
    .m-footer{background:#080808;padding:28px 20px;padding-bottom:calc(20px + var(--tab-h));border-top:1px solid var(--border);text-align:center;}
    .m-footer__copy{font-size:0.68rem;color:rgba(255,255,255,0.3);}
  </style>
</head>
<body>

  <nav class="m-nav">
    <a href="mobile.html" class="m-nav__back">&larr;</a>
    <span class="m-nav__title">MERCH</span>
    <div style="width:32px;"></div>
  </nav>

  <div class="m-header">
    <span class="m-header__eyebrow">Mastry Collection</span>
    <h1 class="m-header__title">Limited Edition Merch</h1>
  </div>

  <section class="m-merch">
    <div class="m-merch-grid">
      <div class="m-merch-item">
        <div class="m-merch-item__img">👕</div>
        <div class="m-merch-item__info">
          <span class="m-merch-item__name">Signature Tee</span>
          <span class="m-merch-item__price">$28</span>
          <button class="m-merch-item__btn">Order</button>
        </div>
      </div>

      <div class="m-merch-item">
        <div class="m-merch-item__img">🧢</div>
        <div class="m-merch-item__info">
          <span class="m-merch-item__name">Logo Cap</span>
          <span class="m-merch-item__price">$32</span>
          <button class="m-merch-item__btn">Order</button>
        </div>
      </div>

      <div class="m-merch-item">
        <div class="m-merch-item__img">🛍️</div>
        <div class="m-merch-item__info">
          <span class="m-merch-item__name">Tote Bag</span>
          <span class="m-merch-item__price">$22</span>
          <button class="m-merch-item__btn">Order</button>
        </div>
      </div>

      <div class="m-merch-item">
        <div class="m-merch-item__img">🧥</div>
        <div class="m-merch-item__info">
          <span class="m-merch-item__name">Hoodie</span>
          <span class="m-merch-item__price">$55</span>
          <button class="m-merch-item__btn">Order</button>
        </div>
      </div>

      <div class="m-merch-item">
        <div class="m-merch-item__img">🥤</div>
        <div class="m-merch-item__info">
          <span class="m-merch-item__name">Ceramic Mug</span>
          <span class="m-merch-item__price">$18</span>
          <button class="m-merch-item__btn">Order</button>
        </div>
      </div>

      <div class="m-merch-item">
        <div class="m-merch-item__img">🧣</div>
        <div class="m-merch-item__info">
          <span class="m-merch-item__name">Beanie</span>
          <span class="m-merch-item__price">$24</span>
          <button class="m-merch-item__btn">Order</button>
        </div>
      </div>
    </div>
  </section>

  <footer class="m-footer">
    <p class="m-footer__copy">© 2026 Mastry · All merch ships within 5 business days</p>
  </footer>

  <script>
    // Mobile-only page
    if(!/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)){
      window.location.replace('index.html');
    }
  </script>
</body>
</html>
