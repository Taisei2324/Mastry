<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Island Cursor Loading Effect</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="demo">
    <p>move / click / hover</p>
    <h1>Island cursor loading effect</h1>
    <button>trigger</button>
  </main>

  <div id="customCursor" aria-hidden="true">
    <img src="./island-logo.svg" alt="">
  </div>

  <div id="loadingBurst" aria-hidden="true">
    <span class="slice" style="--i:0"><b>Island².</b></span>
    <span class="slice" style="--i:1"><b>Island².</b></span>
    <span class="slice" style="--i:2"><b>Island².</b></span>
    <span class="slice" style="--i:3"><b>Island².</b></span>
    <span class="slice" style="--i:4"><b>Island².</b></span>
    <span class="slice" style="--i:5"><b>Island².</b></span>
    <span class="slice" style="--i:6"><b>Island².</b></span>
  </div>

  <script src="./script.js"></script>
</body>
</html>
