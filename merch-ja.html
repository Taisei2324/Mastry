<script>/* day/night theme boot — before the stylesheet so there is no flash.
  A stored choice wins; otherwise local time decides (06–18 = day). */
(function(){var t=null;try{t=localStorage.getItem('mastry-theme');
  /* a manual sun/moon choice holds for 12h, then the clock decides again */
  var ts=+localStorage.getItem('mastry-theme-ts')||0;
  if(Date.now()-ts>432e5)t=null;
}catch(e){}
if(t!=='light'&&t!=='dark'){
  /* is it bright or dark OUTSIDE right now? — seasonal daylight window from
     the local clock: half-width swings ~9.8h (midwinter) to ~14.4h
     (midsummer) around solar noon, temperate-latitude fit (Tokyo-accurate
     to ~15 min). No geolocation, no permission prompt. */
  var now=new Date();
  var doy=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5);
  var half=6.05+1.15*Math.cos(2*Math.PI*(doy-172)/365);
  var hr=now.getHours()+now.getMinutes()/60;
  t=(hr>12-half&&hr<12+half)?'light':'dark';
}
document.documentElement.setAttribute('data-theme',t);})();</script>

<style>
:root{--sans:"Inter","Noto Sans JP",system-ui,sans-serif;--serif:"Cormorant Garamond","Noto Serif JP",serif;}
/* ── merch-only styles, on the shared palette ── */
.merch{max-width:1300px;margin:0 auto;padding-top:calc(var(--nav-h) + clamp(50px,8vw,90px));}
.merch__head{text-align:center;margin-bottom:clamp(40px,6vw,70px);}
.merch__sub{max-width:52ch;margin:0 auto;color:var(--ink-soft);font-size:.98rem;}
.merch__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(18px,2.6vw,34px);}
.mcard{
  background:var(--paper-deep);border:1px solid var(--hairline);border-radius:18px;overflow:hidden;
  cursor:pointer;transition:transform .4s var(--ease),box-shadow .4s;text-align:left;padding:0;font-family:var(--sans);
}
.mcard:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.5),0 0 30px var(--amber-soft);}
/* dark room: product shots sit in the same parchment vitrine as the flavour
   catalog (white studio grounds multiply into parchment instead of glaring) */
.mcard__thumb{aspect-ratio:1/1;overflow:hidden;background:#DFD2B6;}
.mcard__thumb img{mix-blend-mode:multiply;filter:saturate(.97) contrast(1.02);}
.mcard__thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease);}
.mcard:hover .mcard__thumb img{transform:scale(1.04);}
.mcard__body{padding:20px 22px 24px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.mcard__name{font-family:var(--serif);font-weight:500;font-size:1.35rem;color:var(--ink);}
.mcard__price{font-size:.78rem;font-weight:600;letter-spacing:.12em;color:var(--olive);}
.merch__note{
  text-align:center;margin-top:clamp(40px,6vw,64px);font-size:.78rem;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}

/* lightbox */
.lb{
  position:fixed;inset:0;z-index:800;background:rgba(10,8,6,.62);
  display:none;align-items:center;justify-content:center;padding:20px;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.lb.open{display:flex;}
.lb__card{
  background:var(--paper-deep);border:1px solid var(--hairline);
  box-shadow:0 30px 80px rgba(0,0,0,.55);border-radius:22px;max-width:920px;width:100%;max-height:90vh;
  overflow-y:auto;padding:clamp(20px,3vw,36px);
}
.lb__top{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:18px;}
.lb__name{font-family:var(--serif);font-weight:500;font-size:1.7rem;}
.lb__price{font-size:.8rem;font-weight:600;letter-spacing:.12em;color:var(--olive);white-space:nowrap;}
.lb__close{
  background:none;border:0;cursor:pointer;font-size:1.7rem;line-height:1;color:var(--muted);
  padding:2px 8px;transition:color .2s;
}
.lb__close:hover{color:var(--ink);}
.lb__imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:14px;margin-bottom:22px;}
.lb__imgs img{width:100%;border-radius:14px;border:1px solid var(--hairline);background:#DFD2B6;mix-blend-mode:multiply;}
.lb__actions{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
.lb__hint{font-size:.78rem;color:var(--muted);}
.lb__ok{font-family:var(--jp);font-weight:400;color:var(--olive-deep);font-size:.95rem;}

@media (max-width:900px){
  .merch__grid{grid-template-columns:1fr 1fr;}
}
@media (max-width:600px){
  .merch__grid{grid-template-columns:1fr;}
  .lb__imgs{grid-template-columns:1fr;}
}

/* ── day theme: back to the bright studio treatment ── */
[data-theme="light"] .mcard:hover{box-shadow:0 24px 50px rgba(38,52,28,.12);}
[data-theme="light"] .mcard__thumb{background:#fff;}
[data-theme="light"] .mcard__thumb img{mix-blend-mode:normal;filter:none;}
[data-theme="light"] .lb{background:rgba(29,46,24,.55);}
[data-theme="light"] .lb__card{box-shadow:0 30px 80px rgba(38,52,28,.18);}
[data-theme="light"] .lb__imgs img{background:#fff;mix-blend-mode:normal;}

<script>
(function () {
  "use strict";

  var ITEMS = [
    { name: "アイランドTシャツ", price: "$38",
      imgs: ["images/island_front_left_chest_mockup.png", "images/shirt%20back%20merch%20real.png"] },
    { name: "マストリー・フーディ", price: "$68",
      imgs: ["images/hoodie_front_back_color_matched_side_by_side.jpg"] },
    { name: "マストリー・ハット", price: "$34",
      imgs: ["images/side%20merch%20hat.png", "images/hat%20merch.png"] }
  ];

  /* progress hairline */
  var progress = document.getElementById("progress");
  window.addEventListener("scroll", function () {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    progress.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
  }, { passive: true });

  /* mobile menu */
  var burger = document.getElementById("burger");
  var navLinks = document.getElementById("navLinks");
  burger.addEventListener("click", function () {
    var open = navLinks.classList.toggle("open");
    burger.classList.toggle("open", open);
    burger.setAttribute("aria-expanded", open);
  });

  /* lightbox */
  var lb = document.getElementById("lb");
  var lbName = document.getElementById("lbName");
  var lbPrice = document.getElementById("lbPrice");
  var lbImgs = document.getElementById("lbImgs");
  var lbOk = document.getElementById("lbOk");
  var lbHint = document.getElementById("lbHint");
  var lbOrder = document.getElementById("lbOrder");

  function openLB(i) {
    var item = ITEMS[i];
    lbName.textContent = item.name;
    lbPrice.textContent = item.price;
    lbImgs.innerHTML = item.imgs.map(function (src) {
      return '<img src="' + src + '" alt="' + item.name + '" loading="lazy" />';
    }).join("");
    lbOk.hidden = true;
    lbHint.hidden = false;
    lbOrder.hidden = false;
    lb.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeLB() {
    lb.classList.remove("open");
    document.body.style.overflow = "";
  }

  document.querySelectorAll(".mcard").forEach(function (card) {
    card.addEventListener("click", function () { openLB(+card.dataset.item); });
  });
  document.getElementById("lbClose").addEventListener("click", closeLB);
  lb.addEventListener("click", function (e) { if (e.target === lb) closeLB(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeLB(); });

  lbOrder.addEventListener("click", function () {
    lbOrder.hidden = true;
    lbHint.hidden = true;
    lbOk.hidden = false;
  });
})();
</script>
<script>/* one SW at /Mastry/ controls every entry point */if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js',{scope:'./',updateViaCache:'none'}).catch(function(){});});}</script>
<script>/* sun/moon toggle — flips the theme and remembers the choice */
(function(){var b=document.getElementById('themeToggle');if(!b)return;
b.addEventListener('click',function(){var r=document.documentElement;
var next=r.getAttribute('data-theme')==='light'?'dark':'light';
r.setAttribute('data-theme',next);try{localStorage.setItem('mastry-theme',next);localStorage.setItem('mastry-theme-ts',String(Date.now()));}catch(e){}});})();</script>
